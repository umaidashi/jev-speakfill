<!doctype html><meta charset="utf-8"><title>jev-speakfill サンプル — ブランドバッグ商品登録</title>
<form style="font:14px system-ui;max-width:560px;margin:24px auto;display:grid;gap:8px">
  <h3>商品情報（ブランドバッグ）</h3>
  <label for="brand">ブランド</label>
  <select id="brand"><option value="">選択してください</option>
    <option>Louis Vuitton</option><option>CHANEL</option><option>HERMÈS</option><option>GUCCI</option><option>PRADA</option>
    <option>CELINE</option><option>DIOR</option><option>FENDI</option><option>Bottega Veneta</option><option>BALENCIAGA</option>
    <option>LOEWE</option><option>Saint Laurent</option><option>BURBERRY</option><option>MIU MIU</option><option>GOYARD</option>
    <option>Chloé</option><option>GIVENCHY</option><option>VALENTINO</option><option>COACH</option><option>MICHAEL KORS</option>
    <option>kate spade new york</option><option>FURLA</option><option>Tory Burch</option><option>LONGCHAMP</option><option>その他</option>
  </select>
  <label for="category">カテゴリ</label>
  <select id="category"><option value="">選択してください</option>
    <option>ハンドバッグ</option><option>ショルダーバッグ</option><option>トートバッグ</option><option>ボストンバッグ</option><option>クラッチバッグ</option>
    <option>リュック</option><option>ウエストバッグ</option><option>ポーチ</option><option>財布</option>
  </select>
  <label for="model">ライン・モデル名</label><input id="model" placeholder="例: ネヴァーフル MM">
  <label for="material">素材</label>
  <select id="material"><option value="">選択してください</option>
    <option>レザー</option><option>キャンバス</option><option>ナイロン</option><option>エキゾチックレザー</option><option>デニム</option><option>PVC</option><option>スエード</option>
  </select>
  <label for="color">色</label>
  <select id="color"><option value="">選択してください</option>
    <option>黒</option><option>白</option><option>ベージュ</option><option>茶</option><option>赤</option><option>ピンク</option><option>青</option>
    <option>緑</option><option>グレー</option><option>ゴールド</option><option>シルバー</option><option>マルチカラー</option>
  </select>
  <label for="hardware">金具の色</label>
  <select id="hardware"><option value="">選択してください</option>
    <option>ゴールド</option><option>シルバー</option><option>ピンクゴールド</option><option>ガンメタ</option><option>ブラック</option><option>金具なし</option>
  </select>
  <label for="cond">状態ランク</label>
  <select id="cond"><option value="">選択してください</option>
    <option>S（新品・未使用）</option><option>A（未使用に近い）</option><option>B（目立った傷や汚れなし）</option><option>C（やや傷や汚れあり）</option><option>D（傷や汚れあり）</option><option>E（全体的に状態が悪い）</option>
  </select>
  <fieldset><legend>付属品</legend>
    <label><input type="checkbox" id="acc-box">箱</label>
    <label><input type="checkbox" id="acc-bag">保存袋</label>
    <label><input type="checkbox" id="acc-card">ギャランティカード</label>
    <label><input type="checkbox" id="acc-strap">ショルダーストラップ</label>
    <label><input type="checkbox" id="acc-receipt">レシート</label>
  </fieldset>
  <label for="w">幅 (cm)</label><input id="w" type="number" min="0" step="0.5">
  <label for="h">高さ (cm)</label><input id="h" type="number" min="0" step="0.5">
  <label for="d">マチ (cm)</label><input id="d" type="number" min="0" step="0.5">
  <label for="serial">シリアル・製造番号</label><input id="serial">
  <label for="buy">仕入日</label><input id="buy" type="date">
  <label for="cost">仕入れ値</label><input id="cost" type="number" min="0" step="100">
  <label for="price">販売価格</label><input id="price" type="number" min="0" step="100">
  <label for="note">備考</label><textarea id="note"></textarea>
  <hr>
  <h3>出品者</h3>
  <label for="name">氏名</label><input id="name">
  <label for="kana">ふりがな（対象外）</label><input id="kana">
  <label for="tel">電話番号</label><input id="tel" type="tel">
  <label for="zip">郵便番号</label><input id="zip">
  <label for="pref">都道府県</label>
  <select id="pref"><option>東京都</option><option>大阪府</option><option>北海道</option><option>福岡県</option></select>
  <label for="email">メールアドレス</label><input id="email" type="email">
  <label for="pw">パスワード（除外されるべき）</label><input id="pw" type="password">
</form>
<script src="widget.js"></script>
